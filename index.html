<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FAF8FC"></head><body><title>Mạch Ngày</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: one calm column. Header → today summary → day-by-day timeline; a collapsible week strip and a 4–5 tab bar sit at the bottom for the thumb. */
:root{
  --bg:#FAF8FC; --surface:#F0ECF4; --surface2:#E6E1EE; --line:#DAD4E3;
  --fg:#1D1B20; --muted:#6B6573; --accent:#4C5BA8; --accent-ink:#FFFFFF; --accent-soft:#DDE1F7;
  --node:#8A8494; --danger:#C2413A; --warn:#B0661A; --nav:#F2EEF6; --scrim:rgba(20,16,28,.42);
  --f:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141814; --surface:#1F251F; --surface2:#29302A; --line:#343C35;
  --fg:#E3E8E2; --muted:#9AA39A; --accent:#7BD88F; --accent-ink:#0C2414; --accent-soft:#25402C;
  --node:#7BD88F; --nav:#191E19; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141814; --surface:#1F251F; --surface2:#29302A; --line:#343C35;
  --fg:#E3E8E2; --muted:#9AA39A; --accent:#7BD88F; --accent-ink:#0C2414; --accent-soft:#25402C;
  --node:#7BD88F; --nav:#191E19; --scrim:rgba(0,0,0,.6); color-scheme:dark}
/* lựa chọn giao diện riêng của app (thắng cả cài đặt của trình xem) */
:root:root[data-look="light"]{
  --bg:#FAF8FC; --surface:#F0ECF4; --surface2:#E6E1EE; --line:#DAD4E3;
  --fg:#1D1B20; --muted:#6B6573; --accent:#4C5BA8; --accent-ink:#FFFFFF; --accent-soft:#DDE1F7;
  --node:#8A8494; --nav:#F2EEF6; --scrim:rgba(20,16,28,.42); color-scheme:light}
:root:root[data-look="cream"]{
  --bg:#FCF5E1; --surface:#F2E9D0; --surface2:#E9DEC1; --line:#E0D4B5;
  --fg:#2A2418; --muted:#7A6F58; --accent:#5B55A8; --accent-ink:#FFFFFF; --accent-soft:#E5DFF3;
  --node:#6E6A8C; --nav:#F0E6CB; --scrim:rgba(40,30,10,.4); color-scheme:light}
:root:root[data-look="dark"]{
  --bg:#141814; --surface:#1F251F; --surface2:#29302A; --line:#343C35;
  --fg:#E3E8E2; --muted:#9AA39A; --accent:#7BD88F; --accent-ink:#0C2414; --accent-soft:#25402C;
  --node:#7BD88F; --nav:#191E19; --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--f);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tnum{font-variant-numeric:tabular-nums}

.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.top .wrap{display:flex;align-items:center;gap:4px;height:56px}
.top h1{flex:1;margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--fg)}
.ib:hover{background:var(--surface)}
main{padding-bottom:230px}
main.nocal{padding-bottom:120px}

/* today summary */
.dline{font-size:14px;font-weight:600;color:var(--fg);margin:6px 0 4px}
.hero{text-align:center;font-size:22px;font-weight:600;margin:4px 0 12px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.tile{background:var(--surface);border-radius:14px;padding:12px 6px;text-align:center}
.tile b{display:block;font-size:22px;font-weight:600}
.tile span{font-size:12px;color:var(--muted)}
.tile.on{background:var(--accent-soft)}
.tile.warn b{color:var(--danger)}

/* timeline */
.day{margin:0 0 18px}
.dh{font-size:14px;font-weight:600;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.dh .rel{color:var(--muted);font-weight:500}
.tl{position:relative}
.it{position:relative;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:5px 0}
.it::before{content:"";position:absolute;left:13px;top:29px;bottom:-7px;width:2px;background:var(--line)}
.it:last-child::before{display:none}
.ck{width:24px;height:24px;margin:2px 2px 0;border-radius:50%;border:2px solid var(--c,var(--node));display:grid;place-items:center;background:var(--bg);color:var(--accent-ink);position:relative;z-index:1}
.ck svg.i{width:14px;height:14px;stroke-width:3}
.it.done .ck{background:var(--c,var(--accent));border-color:var(--c,var(--accent))}
.it.note .ck{border-style:dashed;border-radius:7px}
.it.event .ck{border-radius:7px}
.it.p3 .ck{border-color:var(--danger)} .it.p2 .ck{border-color:var(--warn)}
.bd{text-align:left;min-width:0;padding:2px 0;width:100%}
.tt{font-size:15px;overflow-wrap:anywhere}
.it.done .tt{text-decoration:line-through;color:var(--muted)}
.mt{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;font-size:12px;color:var(--muted);margin-top:2px}
.mt span{display:inline-flex;align-items:center;gap:3px}
.mt svg.i{width:13px;height:13px}
.mt .od{color:var(--danger)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
.add{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;padding:5px 0;color:var(--muted);text-align:left;width:100%}
.add .pl{width:24px;height:24px;margin:0 2px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;color:var(--muted)}
.add .pl svg.i{width:15px;height:15px;stroke-width:2.4}
.sect{font-size:13px;font-weight:600;color:var(--danger);margin:0 0 4px}
.empty{color:var(--muted);text-align:center;padding:28px 12px;font-size:14px}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.empty code{background:var(--surface);padding:1px 6px;border-radius:6px;font-size:13px}

/* bottom: calendar + nav */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--nav);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.cal .wrap{padding-top:8px}
.calh{display:flex;justify-content:flex-end;align-items:center;gap:2px;font-size:14px;font-weight:600}
.calh button{display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px}
.week,.month{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.wl{font-size:12px;color:var(--muted);padding:2px 0}
.dd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0 4px}
.dd b{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-weight:500;font-size:14px}
.dd.today b{color:var(--accent);font-weight:700}
.dd.on b{background:var(--accent);color:var(--accent-ink)}
.dd i{width:4px;height:4px;border-radius:50%;background:var(--muted)}
.dd i.no{background:transparent}
.dd.out b{opacity:.35}
nav.tabs{display:grid;padding:6px 0 8px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
.tab .pill{width:56px;height:30px;border-radius:15px;display:grid;place-items:center}
.tab.on{color:var(--fg);font-weight:600}
.tab.on .pill{background:var(--accent-soft)}
.fab{position:fixed;z-index:26;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));width:56px;height:56px;border-radius:16px;background:var(--accent-soft);color:var(--fg);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.14)}
.fab svg.i{width:26px;height:26px}

/* lists & cards */
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 12px}
.ph h2{margin:0;font-size:22px;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:19px;background:var(--surface);font-weight:500;font-size:14px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border-radius:14px;padding:14px;margin-bottom:8px;min-width:0}
.card .grow{flex:1;min-width:0}
.card b{display:block;font-weight:600;overflow-wrap:anywhere}
.card span.s{font-size:13px;color:var(--muted)}
.bar{height:4px;border-radius:2px;background:var(--surface2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--c,var(--accent))}
.sw{width:12px;height:12px;border-radius:50%;flex:none;background:var(--c)}
.inline{display:flex;gap:8px;margin:0 0 12px}
.inp{width:100%;min-width:0;height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:15px}
textarea.inp{height:auto;padding:10px 14px;min-height:80px;resize:vertical}
select.inp{padding:0 10px}
.inp:focus{outline:none;border-color:var(--accent)}
.grp{font-size:13px;font-weight:600;color:var(--muted);margin:18px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.note{display:block;width:100%;text-align:left;background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.note b{display:block;font-weight:600}
.note p{margin:4px 0 0;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border-radius:14px;padding:14px}
.stat b{display:block;font-size:26px;font-weight:600}
.stat span{font-size:12px;color:var(--muted)}
.chart{background:var(--surface);border-radius:14px;padding:14px}
.chart svg{display:block;width:100%;height:auto}

/* settings */
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.set>div:first-child{flex:1;min-width:180px}
.set b{display:block;font-weight:500}
.set span{font-size:13px;color:var(--muted)}
.sw2{width:46px;height:28px;border-radius:14px;background:var(--surface2);position:relative;flex:none}
.sw2::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:left .15s}
.sw2.on{background:var(--accent)}
.sw2.on::after{left:22px;background:var(--accent-ink)}
.seg{display:flex;background:var(--surface);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{flex:1;height:34px;padding:0 10px;border-radius:9px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.looks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.look{border-radius:12px;border:2px solid var(--line);padding:10px 6px 8px;font-size:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:6px}
.look i{width:28px;height:28px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.look.on{border-color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.scrim{align-items:center;padding:24px}}
.sheet{width:100%;max-width:560px;max-height:calc(100% - 20px - env(safe-area-inset-top,0px));overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.sheet{border-radius:22px}}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 2px;flex:none}
.sh{display:flex;align-items:center;gap:8px}
.sh h3{flex:1;margin:0;font-size:18px;font-weight:600}
.tin{border:0;background:transparent;font-size:20px;font-weight:600;padding:4px 0;width:100%;border-bottom:1px solid var(--line);border-radius:0}
.tin:focus{outline:none;border-color:var(--accent)}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f>label,.fl{font-size:12px;font-weight:600;color:var(--muted)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.r3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px}
@media (max-width:440px){.r3{grid-template-columns:1fr 1fr}.r3>:first-child{grid-column:1/-1}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;background:var(--surface);font-size:13px}
.chip.on{background:var(--accent-soft);font-weight:600}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.wdp{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wdp button{height:34px;border-radius:10px;background:var(--surface);font-size:12px;font-weight:600}
.wdp button.on{background:var(--accent);color:var(--accent-ink)}
.cl{display:flex;flex-direction:column;gap:2px}
.clr{display:flex;align-items:center;gap:8px}
.clr input[type=text]{flex:1;min-width:0;border:0;border-bottom:1px solid var(--line);background:transparent;padding:7px 2px;border-radius:0}
.clr input[type=text]:focus{outline:none;border-color:var(--accent)}
.box{width:20px;height:20px;border-radius:6px;border:2px solid var(--node);display:grid;place-items:center;flex:none;color:var(--accent-ink)}
.box.on{background:var(--accent);border-color:var(--accent)}
.box svg.i{width:12px;height:12px;stroke-width:3.2}
.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom,0px));background:var(--bg);padding:10px 0 2px;border-top:1px solid var(--line)}
.foot div{display:flex;gap:6px;flex-wrap:wrap}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:30px;height:30px;border-radius:50%;background:var(--c);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--line)}
.colors button.on{box-shadow:0 0 0 2px var(--fg)}
.parsed{display:flex;flex-wrap:wrap;gap:6px;min-height:28px}
.hint{font-size:13px;color:var(--muted)}
.hint code{background:var(--surface);padding:1px 5px;border-radius:5px;font-size:12px}
.mlist{display:flex;flex-direction:column}
.mrow{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.mrow .grow{flex:1}

.toasts{position:fixed;z-index:60;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{pointer-events:auto;background:var(--fg);color:var(--bg);padding:10px 10px 10px 16px;border-radius:12px;display:flex;gap:8px;align-items:center;max-width:460px;width:100%;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast .grow{flex:1;min-width:0}
.toast button{color:var(--accent-soft);font-weight:600;padding:6px 10px;border-radius:8px}
.toast.rem{background:var(--accent);color:var(--accent-ink)}
.toast.rem button{color:var(--accent-ink);background:rgba(255,255,255,.18)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:#3FAE5A}
/* Đăng nhập đồng bộ */
.login{max-width:400px;margin:28px auto 0;display:flex;flex-direction:column;gap:10px}
.login h2{margin:0;font-size:22px;font-weight:600}
.login p{margin:0 0 6px}
.login form{display:flex;flex-direction:column;gap:10px}
.login .btn{justify-content:center;height:44px}
.lg-err{color:var(--danger);font-size:13px;min-height:18px}
.lg-more{display:flex;justify-content:space-between;gap:8px;margin-top:6px}
/* Chọn giao diện */
.tprev{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:5;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:12px 14px 6px;margin:4px 0 8px;box-shadow:0 8px 18px rgba(0,0,0,.08)}
.tprev-h{display:flex;align-items:center;gap:6px;margin-bottom:8px;min-height:32px}
.tprev-h b{flex:1;font-size:14px;font-weight:600}
.trow{display:flex;align-items:center;gap:14px;width:100%;padding:11px 4px;text-align:left;font-size:15px}
.trow .rad{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;flex:none}
.trow.on .rad{border-color:var(--accent)}
.trow.on .rad::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.trow.on{font-weight:600}
.trow .grow{flex:1;min-width:0}
.tsw{display:flex;gap:3px;padding:3px;border-radius:9px;border:1px solid rgba(128,128,128,.35);flex:none}
.tsw i{width:13px;height:20px;border-radius:5px}
.tgrp{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:16px 4px 2px}
/* Bảng dự án */
.tdot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--c);margin-right:10px;vertical-align:1px}
.pchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:2px -16px 16px;padding:2px 16px}
.pchips::-webkit-scrollbar{display:none}
.pchip{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:10px;border:1.5px solid var(--c,var(--line));font-size:14px;font-weight:500;white-space:nowrap}
.pchip svg.i{width:16px;height:16px}
.pchip.on{background:var(--c,var(--fg));border-color:var(--c,var(--fg));color:#fff;font-weight:600}
.pchip.on:not([style]){color:var(--bg)}
.pchip.add{border-style:dashed;color:var(--muted)}
.pstat{display:flex;align-items:center;gap:12px}
.pbar{flex:1;height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:5px;background:var(--c);transition:width .4s}
.pstat b{font-size:24px;font-weight:600;min-width:58px;text-align:right}
.pstat small{font-size:14px;color:var(--muted);margin-left:1px}
.pmeta{display:flex;gap:18px;font-size:13px;color:var(--muted);margin:4px 0 4px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.pmeta span{display:inline-flex;align-items:center;gap:4px}
.pmeta svg.i{width:14px;height:14px}
.pmeta .od,.mt .od{color:var(--danger)}
.it.brow{grid-template-columns:28px 1fr auto;padding:14px 0;border-bottom:1px solid var(--line)}
.it.brow::before{display:none}
.nt{font-size:13px;color:var(--muted);white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.bdg{font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--surface);color:var(--muted);white-space:nowrap;margin-top:2px}
.bdg.late{background:var(--danger);color:#fff}
.bdg.now{background:var(--accent-soft);color:var(--fg)}

const pending=new Map(); const inflight=new Set();
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LKEY)||'null');if(j&&Array.isArray(j.docs)){for(const d of j.docs)if(d&&d.id)S.docs.set(d.id,d);S.cacheSrc=j.src||'local'}}catch(e){}}
let saveT;function saveLocal(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(LKEY,JSON.stringify({src:S.mode,docs:[...S.docs.values()]}))}catch(e){}},250)}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let flushing=false;
async function flush(){
  if(flushing||!S.col)return; flushing=true;
  try{
    while(pending.size){
      const [id,w]=pending.entries().next().value; pending.delete(id); inflight.add(id);
      try{
        if(S.fb){/* Firestore tự giữ hàng chờ khi mất mạng, không cần đợi */
          const ref=S.col.doc(id);(w.op==='del'?ref.delete():ref.set(JSON.parse(JSON.stringify(w.data)))).catch(e=>{if(e&&e.code==='permission-denied')toast('Không có quyền ghi dữ liệu. Kiểm tra quy tắc Firestore.')});

      }
      catch(e){
        const code=e&&e.code;
        if(code==='unavailable'||code==='resource_exhausted'){ if(!pending.has(id))pending.set(id,w); inflight.delete(id); await sleep(1200+Math.random()*1200); continue; }
        if(code==='quota_exceeded') toast('Bộ nhớ đã đầy. Hãy dọn việc đã xong trong Cài đặt rồi thử lại.');
        else toast('Không lưu được một mục ('+(code||'lỗi')+'). Dữ liệu vẫn còn trên máy này.');
      }
      inflight.delete(id);
    }
  } finally { flushing=false; setSync(); }
}

function attachSnapshot(){
  let first=true;
  const loadTimer=setTimeout(()=>{if(!S.ready){S.err='slow';setSync()}},10000);
  const onNext=snap=>{
    clearTimeout(loadTimer);
    if(S.fb)S.meta={pending:snap.metadata.hasPendingWrites,cache:snap.metadata.fromCache};
    const next=new Map();
    for(const d of snap.docs){const v=d.data();if(v)next.set(d.id,cp({...v,id:d.id}))}
    /* lần đầu thấy kho trống trên máy chủ: đưa dữ liệu đang có trên máy lên */
    if(first&&!(S.fb&&snap.metadata.fromCache)){first=false;if(snap.empty&&S.cacheSrc!=='db'&&S.docs.size){for(const [k,v] of S.docs){next.set(k,v);queue(k,'set',v)}}}
    for(const id of [...pending.keys(),...inflight]){const loc=S.docs.get(id);if(loc)next.set(id,loc);else next.delete(id)}
    S.docs=next;S.ready=true;S.err=null;saveLocal();setSync();migrateHabits();applyWidgetActions();if(!ed)render();flush();
  };
  const onErr=err=>{clearTimeout(loadTimer);S.err=err&&err.code;setSync()};
  S.unsub=S.fb?S.col.onSnapshot({includeMetadataChanges:true},onNext,onErr):S.col.onSnapshot(onNext,onErr);
}
const loadScript=src=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>{s.remove();rej(new Error(src))};document.head.appendChild(s)});
async function loadFirebase(){
  if(window.firebase&&firebase.firestore&&firebase.auth)return;
  for(const base of ['vendor/',`https://www.gstatic.com/firebasejs/${FB_VER}/`]){
    try{for(const n of ['app','auth','firestore'])await loadScript(base+`firebase-${n}-compat.js`);if(window.firebase&&firebase.firestore&&firebase.auth)return}catch(e){}
  }

}

async function initFirebase(){

async function fbSign(mode){

  er.textContent='';

  try{
    if(mode==='reset'){await fbAuth.sendPasswordResetEmail(em.trim());er.textContent='Đã gửi email đặt lại mật khẩu.';return}
    if(!pw){er.textContent='Nhập mật khẩu.';return}
    er.textContent=mode==='up'?'Đang tạo tài khoản…':'Đang đăng nhập…';
    if(mode==='up')await fbAuth.createUserWithEmailAndPassword(em.trim(),pw);else await fbAuth.signInWithEmailAndPassword(em.trim(),pw);
  }catch(e){er.textContent=FB_ERR[e&&e.code]||(String(e&&e.code).startsWith('auth/api-key')?'Cấu hình Firebase chưa đúng (apiKey).':'')||('Lỗi: '+((e&&(e.code||e.message))||'không rõ'))}

function setSync(){
  const els=$$('[data-sync]'); if(!els.length)return;
  let t,ok=false;
  if(S.mode==='db'&&S.fb){ if(S.err){t='Lỗi đồng bộ ('+S.err+')'} else if(!S.ready){t='Đang tải…'} else if(S.meta&&S.meta.cache&&!navigator.onLine){t='Ngoại tuyến · sẽ tự đồng bộ khi có mạng'} else if(S.meta&&S.meta.pending){t='Đang đồng bộ…'} else {t='Đã đồng bộ · '+((S.user&&S.user.email)||'');ok=true} }
  else if(S.mode==='fb-wait'){t='Đang kết nối đồng bộ…'}
  else if(S.mode==='fb-login'){t='Chưa đăng nhập'}
  else if(S.mode==='db'){ if(S.err){t='Mất kết nối, đang lưu trên máy'} else if(!S.ready){t='Đang tải…'} else if(pending.size||inflight.size){t='Đang lưu…'} else {t='Đã lưu vào tài khoản';ok=true} }
  else if(S.mode==='local-only'){t='Chỉ lưu trên thiết bị này'} else t='Đang kết nối…';
  for(const el of els){el.className='sync'+(ok?' ok':'');el.innerHTML='<i></i>'+esc(t)}
}

function occurs(it,s){
  if(!it.date)return false;
  if(it.skipDates&&it.skipDates.includes(s))return false;
  const r=it.repeat;
  if(!r||!r.freq||r.freq==='none')return it.date===s;
  if(s<it.date)return false; if(r.until&&s>r.until)return false;
  const iv=Math.max(1,+r.interval||1), dd=diffDays(it.date,s), a=pd(it.date), b=pd(s);
  if(r.freq==='daily')return dd%iv===0;

function radarSVG(ax){

  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/5;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  const P=arr=>arr.map(q=>f1(q[0])+','+f1(q[1])).join(' ');
  const ring=f=>P(AXES.map((_,i)=>pt(i,R*f)));
  let g=`<polygon points="${ring(1)}" fill="none" stroke="#27272A"/><polygon points="${ring(.6)}" fill="none" stroke="#27272A" stroke-dasharray="3 3"/>`;
  g+=AXES.map((_,i)=>{const [x,y]=pt(i,R);return `<line x1="${cx}" y1="${cy}" x2="${f1(x)}" y2="${f1(y)}" stroke="#27272A"/>`}).join('');
  const dp=AXES.map(([k],i)=>pt(i,R*Math.max(.03,ax.scores[k]/100)));
  g+=`<g class="rd"><polygon points="${P(dp)}" fill="rgba(244,244,245,.14)" stroke="#F4F4F5" stroke-width="1.5" stroke-linejoin="round"/>${dp.map(q=>`<circle cx="${f1(q[0])}" cy="${f1(q[1])}" r="2.6" fill="#F4F4F5"/>`).join('')}</g>`;
  g+=AXES.map(([k,l],i)=>{const [lx,ly]=pt(i,R+16),[dx,dy]=dp[i];const anc=Math.abs(lx-cx)<4?'middle':lx>cx?'start':'end';const vy=i===0?ly-14:ly+14;
    return `<g class="rv${sel===k?' sel':''}" data-act="axsel" data-k="${k}"><circle cx="${f1(lx)}" cy="${f1(ly)}" r="18" fill="transparent"/><circle cx="${f1(dx)}" cy="${f1(dy)}" r="12" fill="transparent"/>`+
      `<text x="${f1(lx)}" y="${f1(ly)}" text-anchor="${anc}" dominant-baseline="middle" font-size="12" font-weight="600" fill="#F4F4F5">${l}</text>`+
      `<text class="val" x="${f1(lx)}" y="${f1(vy)}" text-anchor="${anc}" dominant-baseline="middle" font-size="11" fill="#F4F4F5" fill-opacity=".7">${l}: ${ax.scores[k]}%</text></g>`}).join('');
  return `<svg class="radar" viewBox="0 -12 240 224" role="img" aria-label="Cân bằng 7 ngày: ${AXES.map(([k,l])=>l+' '+ax.scores[k]+'%').join(', ')}">${g}</svg>`;
}

function repInfo(it){

  if(it.date)for(let s=addD(t,-1),g=0;g<60&&s>=it.date;g++,s=addD(s,-1)){if(occurs(it,s)&&!isDone(it,s)){missed++;if(!last)last=s}}

function weekCal(){

  const head=`<div class="calh"><button data-act="calopen" aria-expanded="${ui.calOpen}">Tháng ${+ui.month.slice(5,7)} ${ui.month.slice(0,4)} ${ic(ui.calOpen?'down':'up')}</button></div>`;
  const labels=Array.from({length:7},(_,i)=>`<div class="wl">${WD[(st.weekStart+i)%7]}</div>`).join('');
  const cell=(s,out)=>{const n=itemsOn(s).filter(x=>x.type!=='note'&&!isDone(x,s)).length;return `<button class="dd${s===a?' on':''}${s===t?' today':''}${out?' out':''}" data-act="pick" data-date="${s}" aria-label="${esc(fmtLong(s))}"><b class="tnum">${pd(s).getDate()}</b><i class="${n?'':'no'}"></i></button>`};
  if(!ui.calOpen){const d=pd(a).getDay();const start=addD(a,-((d-st.weekStart+7)%7));
    return head+`<div class="week">${labels}${Array.from({length:7},(_,i)=>cell(addD(start,i),false)).join('')}</div>`}
  const [y,mo]=ui.month.split('-').map(Number);const first=new Date(y,mo-1,1);const start=addD(ds(first),-((first.getDay()-st.weekStart+7)%7));
  return `<div class="calh"><button data-act="mon" data-n="-1" aria-label="Tháng trước">${ic('left')}</button><span style="flex:1"></span><button data-act="mon" data-n="1" aria-label="Tháng sau" style="transform:scaleX(-1)">${ic('left')}</button>${head.replace('<div class="calh">','').replace(/<\/div>$/,'')}</div>
    <div class="month">${labels}${Array.from({length:42},(_,i)=>{const s=addD(start,i);return cell(s,pd(s).getMonth()!==mo-1)}).join('')}</div>`;
}

function toast(msg,action,opt={}){
  const el=document.createElement('div'); el.className='toast'+(opt.cls?' '+opt.cls:''); el.setAttribute('role','status');
  el.innerHTML=`<div class="grow">${opt.html?msg:esc(msg)}</div>`;
  const acts=Array.isArray(action)?action:action?[action]:[];
  for(const a of acts){const b=document.createElement('button');b.textContent=a.label;b.onclick=()=>{a.fn();el.remove()};el.appendChild(b)}
  const x=document.createElement('button');x.innerHTML=ic('x');x.setAttribute('aria-label','Đóng');x.onclick=()=>el.remove();el.appendChild(x);
  $('#toasts').appendChild(el); if(!opt.sticky)setTimeout(()=>el.remove(),acts.length?6000:3000);
}
let actx=null;
document.addEventListener('pointerdown',()=>{if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}},{once:true});
function beep(){if(!actx||!settings().sound)return;try{const t=actx.currentTime;[0,.18].forEach(dt=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.0001,t+dt);g.gain.exponentialRampToValueAtTime(.25,t+dt+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dt+.15);o.start(t+dt);o.stop(t+dt+.16)})}catch(e){}}
const FKEY='machngay.fired'; let fired=new Set(); try{fired=new Set(JSON.parse(localStorage.getItem(FKEY)||'[]'))}catch(e){}
function checkReminders(){
  const now=Date.now(),t=today(),days=[t,addD(t,1)]; let changed=false;
  const fire=(key,at,cb)=>{if(now>=at&&now-at<15*60000&&!fired.has(key)){fired.add(key);changed=true;cb()}};
  for(const it of all('item')){ if(!it.reminders||!it.reminders.length)continue;
    for(const s of days){ if(!occurs(it,s)||isDone(it,s))continue; const [hh,mm]=(it.time||'09:00').split(':').map(Number); const at=pd(s); at.setHours(hh,mm,0,0);
      for(const m of it.reminders)fire(it.id+'|'+s+'|'+m,at.getTime()-m*60000,()=>{beep();toast(`<b>${esc(it.title)}</b><br><span style="opacity:.85">${esc(relDay(s))}${it.time?' · '+it.time:''}</span>`,[{label:'Xong',fn:()=>{const x=get(it.id);if(x&&!isDone(x,s))toggleItem(it.id,s)}},{label:'Mở',fn:()=>openEditor(it.id,{},s)}],{html:true,sticky:true,cls:'rem'})}) } }
  if(changed){const keep=[...fired].filter(k=>k.split('|')[1]>=addD(t,-2));fired=new Set(keep);try{localStorage.setItem(FKEY,JSON.stringify(keep))}catch(e){}}
}

async function exportData(){
  const json=JSON.stringify({app:'Mạch Ngày',version:1,exportedAt:new Date().toISOString(),docs:[...S.docs.values()]},null,1);
  const name=`mach-ngay-${today()}.json`;
  if(window.AndroidBridge&&AndroidBridge.saveFile){try{AndroidBridge.saveFile(name,json)}catch(e){toast('Không lưu được tệp.')}return}
  let dl=null; try{dl=window.claude&&await window.claude.use('downloads')}catch(e){}
  if(dl){try{await dl.save({filename:name,data:json});toast('Đã xuất tệp sao lưu.');return}catch(e){if(e&&e.code==='declined')return}}
  try{await navigator.clipboard.writeText(json);toast('Không tải tệp được ở đây, đã sao chép dữ liệu vào bộ nhớ tạm.')}catch(e){toast('Không xuất được dữ liệu ở chế độ xem này.')}
}
function importData(text){
  let j; try{j=JSON.parse(text)}catch(e){toast('Tệp không phải JSON hợp lệ.');return}
  const docs=Array.isArray(j)?j:j&&j.docs; if(!Array.isArray(docs)){toast('Không tìm thấy dữ liệu Mạch Ngày trong tệp.');return}
  let n=0; for(const d of docs){if(d&&d.id&&d.kind&&typeof d.id==='string'&&/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(d.id)){S.docs.set(d.id,d);if(S.mode!=='local-only')queue(d.id,'set',d);n++}}
  saveLocal(); render(); toast(`Đã khôi phục ${n} mục.`);
}

  'ed-save':()=>edSave(),
  'ed-del':()=>{const id=ed.d.id;closeSheet();deleteWithUndo(id)},
  'ed-dup':()=>{const c=cp(ed.d);c.id=newId();c.title=c.title+' (bản sao)';c.done=false;c.doneDates=[];c.createdAt=Date.now();put(c);closeSheet();toast('Đã nhân bản')},
  'ed-done':()=>{const d=ed.d;const s=ed.occ||d.date;if(isRep(d)){const dd=new Set(d.doneDates||[]);dd.has(s)?dd.delete(s):dd.add(s);d.doneDates=[...dd]}else{d.done=!d.done;d.doneAt=d.done?Date.now():null}edSave()},
  'ed-skip':()=>{const occ=ed.occ;const x=cp(get(ed.d.id));x.skipDates=[...new Set([...(x.skipDates||[]),occ])];put(x);closeSheet();toast('Đã bỏ lần '+fmtShort(occ),{label:'Hoàn tác',fn:()=>{const y=cp(get(x.id));y.skipDates=(y.skipDates||[]).filter(z=>z!==occ);put(y)}})},
  'p-color':e=>{ed.d.color=e.dataset.c;drawProject()},
  'p-save':()=>{const d=ed.d;d.name=(d.name||'').trim();if(!d.name){$('#p-name').focus();toast('Hãy đặt tên dự án.');return}if(!d.columns||!d.columns.length)d.columns=[{id:'main',name:'Việc'}];const isNew=ed.isNew;put(d);closeSheet();if(isNew){try{localStorage.setItem('machngay.board',d.id)}catch(x){}go('board',{project:d.id})}},
  'p-askdel':()=>{ed.confirm=true;drawProject()}, 'p-cancel':()=>{ed.confirm=false;drawProject()},
  'p-del':()=>{const id=ed.d.id;all('item').filter(x=>x.projectId===id).forEach(x=>remove(x.id,true));remove(id,true);go('board');toast('Đã xoá dự án')},
  'p-arch':()=>{const d=cp(get(ed.d.id));d.archived=true;put(d);go('board');toast('Đã lưu trữ dự án',{label:'Hoàn tác',fn:()=>{const x=cp(get(d.id));x.archived=false;put(x)}})},
  't-color':e=>{ed.d.color=e.dataset.c;drawTag()},
  't-save':()=>{const d=ed.d;d.name=(d.name||'').trim().replace(/^#/,'');if(!d.name){toast('Hãy đặt tên thẻ.');return}put(d);closeSheet()},
  't-del':()=>{const id=ed.d.id;for(const it of all('item').filter(x=>(x.tags||[]).includes(id))){const x=cp(it);x.tags=x.tags.filter(t=>t!==id);put(x,true)}closeSheet();if(ui.view==='tag')ui.view='tags';deleteWithUndo(id)},
  eodtg:()=>{const p=eodPref(),s=ui.anchor,d=computeDay(s);if(eodIsOpen(s,d)){p.open=false;if(eodAuto(s,d))p.closedOn=today()}else{p.open=true;p.closedOn=null}saveEodPref();ui.eodAnim=true;render()},
  eodface:e=>{const p=eodPref();if(p.face===e.dataset.f)return;p.face=e.dataset.f;saveEodPref();ui.eodAnim=true;render()},
  axsel:e=>{ui.axSel=ui.axSel===e.dataset.k?null:e.dataset.k;render()},
  'ed-axis':e=>{ed.d.axis=ed.d.axis===e.dataset.k?null:e.dataset.k;drawEditor()},
  'p-axis':e=>{ed.d.axis=ed.d.axis===e.dataset.k?null:e.dataset.k;drawProject()},
  't-axis':e=>{ed.d.axis=ed.d.axis===e.dataset.k?null:e.dataset.k;drawTag()},
  'qa-add':()=>qaCommit(false), 'qa-detail':()=>qaCommit(true)
};
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]'); if(!el)return;
  const fn=A[el.dataset.act]; if(!fn)return;
  if(el.dataset.act==='scrim'&&ev.target!==el)return;
  if(el.tagName==='BUTTON')ev.preventDefault();
  fn(el,ev);
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='q'){ui.q=t.value;$('#qres').innerHTML=searchRes();return}
  if(t.id==='qa'){qaPreview();return}
  if(!ed)return;
  if(t.dataset.f){let v=t.value;if(t.type==='date'||t.type==='time'||t.tagName==='SELECT')v=v||null;if(t.type==='number'||t.dataset.num)v=+v||0;if(t.dataset.f==='repeat.interval')v=Math.max(1,v);setPath(ed.d,t.dataset.f,v);
    if(t.dataset.f==='time'&&$('#e-end'))$('#e-end').disabled=!v;}
  if(t.dataset.ck!=null)ed.d.checklist[+t.dataset.ck].text=t.value;
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='e-remadd'&&t.value!==''){ed.d.reminders=[...(ed.d.reminders||[]),+t.value].sort((a,b)=>a-b);drawEditor();return}
  if(t.id==='e-rep'){ed.d.repeat.freq=t.value;if(t.value==='weekly'&&!(ed.d.repeat.days||[]).length&&ed.d.date)ed.d.repeat.days=[pd(ed.d.date).getDay()];drawEditor();return}
  if(t.id==='e-proj'){ed.d.projectId=t.value||null;return}
  if(t.dataset.tg){const v=Math.max(1,Math.min(99,Math.round(+t.value)||1));setSetting('axisTarget',{...axisTarget(),[t.dataset.tg]:v});return}
  if(t.id==='set-defrem'){setSetting('defaultRem',t.value===''?[]:[+t.value]);return}
  if(t.id==='imp'&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>importData(String(r.result));r.readAsText(t.files[0]);t.value='';return}
});
document.addEventListener('submit',ev=>{
  ev.preventDefault(); const f=ev.target, k=f.dataset.form;
  if(k==='qa'){qaCommit(false);return}
  if(k==='login'){fbSign('in');return}
  if(k==='newtag'){const v=$('#e-newtag').value.trim().replace(/^#/,'');if(!v)return;const [id]=ensureTags([v]);ed.d.tags=[...new Set([...(ed.d.tags||[]),id])];drawEditor();return}
  if(k==='add'){const inp=f.querySelector('input');const v=inp.value.trim();if(!v)return;const ctx=f.dataset.ctx==='project'?{projectId:ui.project}:{};const it=itemFromParsed(parseQuick(v,null),ctx);if(!it.title)return;put(it);inp.value='';setTimeout(()=>{const n=document.getElementById(inp.id);n&&n.focus()},0);toast(it.date?`Đã thêm vào ${relDay(it.date)}`:'Đã thêm')}
});
window.mnBack=()=>{if(ed){closeSheet();return true}if(ui.view!=='timeline'){go('timeline');return true}return false};
document.addEventListener('keydown',ev=>{
  const t=ev.target;
  if(t.id==='e-cknew'&&ev.key==='Enter'){ev.preventDefault();const v=t.value.trim();if(v){ed.d.checklist=[...(ed.d.checklist||[]),{id:newId(),text:v,done:false}];drawEditor();setTimeout(()=>$('#e-cknew')&&$('#e-cknew').focus(),10)}return}
  if(ev.key==='Escape'&&ed){closeSheet();return}
  if(ed||/INPUT|TEXTAREA|SELECT/.test(t.tagName)||ev.metaKey||ev.ctrlKey||ev.altKey)return;
  if(ev.key==='n'||ev.key==='N'){ev.preventDefault();openQuick(quickCtx())}
  else if(ev.key==='/'){ev.preventDefault();go('search');setTimeout(()=>$('#q')&&$('#q').focus(),20)}
  else if(ev.key==='t'){go('timeline',{anchor:today()})}
});
addEventListener('resize',()=>{const b=$('#bottom');if(b)$('#fab').style.bottom=(b.offsetHeight+14)+'px'});

/* ---------- cầu nối với bản APK: widget màn hình chính, nhắc nhở, thanh trạng thái ---------- */
const AB=window.AndroidBridge;
let nT;
function pushNative(){if(!AB)return;clearTimeout(nT);nT=setTimeout(()=>{try{
  const t=today(),cs=getComputedStyle(document.documentElement),g=n=>cs.getPropertyValue(n).trim();
  const dark=String(cs.colorScheme||g('color-scheme')).includes('dark');
  const day=s=>({date:s,items:itemsOn(s).filter(x=>x.type!=='note').sort(sortDay).slice(0,40).map(x=>({id:x.id,title:x.title||'(Không tên)',time:x.time?x.time+(x.end?'–'+x.end:''):'',done:isDone(x,s),color:colorOf(x)||''}))});
  if(AB.widget)AB.widget(JSON.stringify({days:[day(t),day(addD(t,1))],overdue:overdue().length,theme:{bg:g('--bg'),surface:g('--surface'),fg:g('--fg'),muted:g('--muted'),accent:g('--accent'),danger:g('--danger'),line:g('--line'),dark}}));
  if(AB.setBars)AB.setBars(g('--bg'),g('--nav'),dark);
  if(AB.reminders){const now=Date.now(),list=[];
    for(const it of all('item')){if(!it.reminders||!it.reminders.length)continue;
      for(const s of [t,addD(t,1),addD(t,2)]){if(!occurs(it,s)||isDone(it,s))continue;const [hh,mm]=(it.time||'09:00').split(':').map(Number);const at=pd(s);at.setHours(hh,mm,0,0);
        for(const m of it.reminders){const w=at.getTime()-m*60000;if(w>now)list.push({key:it.id+'|'+s+'|'+m,id:it.id,date:s,title:it.title||'Nhắc việc',body:relDay(s)+(it.time?' · '+it.time:'')+(m?' · còn '+remLabel(m).replace(' trước',''):''),at:w})}}}
    list.sort((a,b)=>a.at-b.at);AB.reminders(JSON.stringify(list.slice(0,60)))}
}catch(e){}},500)}
function applyWidgetActions(){
  if(!(AB&&AB.takeActions))return;let acts=[];try{acts=JSON.parse(AB.takeActions()||'[]')}catch(e){}
  for(const x of acts){if(x.a!=='toggle')continue;const it=get(x.id);if(it&&isDone(it,x.date)!==!!x.done)toggleItem(x.id,x.date)}
}
window.mnResume=()=>{applyWidgetActions();if(!ed)render()};
window.mnIntent=o=>{applyWidgetActions();if(!o)return;
  if(o.open&&get(o.open)){go('timeline',{anchor:o.date||today()});openEditor(o.open,{},o.date||get(o.open).date||null)}
  else if(o.quick){go('timeline',{anchor:today()});openQuick({date:today()})}};

initStore();
setTimeout(checkReminders,2000);
})();
</script>
